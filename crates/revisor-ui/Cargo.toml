[package]
name = "revisor-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
revisor-core = { path = "../revisor-core" }
# The regional formats of Windows and the letters of attributes from its property system
# (format.rs), and COM for the latter (export.rs).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
