# cargo-about configuration for THIRD-PARTY-LICENSES.txt (see about.hbs for how to regenerate).

# Licence order is preference order: a crate under "MIT OR Apache-2.0" is listed under MIT.
accepted = ["MIT", "Apache-2.0", "Zlib", "Unicode-3.0", "Unlicense"]
targets = ["x86_64-pc-windows-msvc"]

# Only what is compiled into revisor.exe: build scripts and tests ship nothing.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# revisor's own crates (publish = false) are covered by LICENSE, not by this file.
private = { ignore = true }
