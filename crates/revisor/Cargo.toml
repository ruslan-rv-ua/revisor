[package]
name = "revisor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "revisor"

[dependencies]
revisor-core = { path = "../revisor-core" }
wxdragon = { version = "0.9.24", default-features = false }
# The options of revisor-cli (TASK-47); its help, errors and exit codes are revisor's own.
lexopt = "0.3.2"
# The Win32 calls wxDragon does not expose: WM_MENUCHAR, live regions, focus, sounds
# (ADR-0008).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# The tests of the jobs hold a profile's database busy, as a snapshot being saved does.
rusqlite = { version = "0.41", features = ["bundled"] }

[build-dependencies]
embed-manifest = "1.4"
