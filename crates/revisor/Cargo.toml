[package]
name = "revisor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
revisor-core = { path = "../revisor-core" }
revisor-ui = { path = "../revisor-ui" }
wxdragon = { version = "0.9.24", default-features = false }
# The Win32 calls wxDragon does not expose: WM_MENUCHAR, live regions, focus, sounds
# (ADR-0008). The regional formats and the property system are revisor-ui's (TASK-47).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# The tests of the jobs hold a profile's database busy, as a snapshot being saved does.
rusqlite = { version = "0.41", features = ["bundled"] }

[build-dependencies]
embed-manifest = "1.4"
