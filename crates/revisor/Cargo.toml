[package]
name = "revisor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
revisor-core = { path = "../revisor-core" }
wxdragon = { version = "0.9.24", default-features = false }
# The Win32 calls wxDragon does not expose: WM_MENUCHAR, live regions, focus (ADR-0008).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-manifest = "1.4"
